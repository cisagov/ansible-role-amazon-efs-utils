---
# The system packages to install.  See here for more details:
# https://github.com/aws/efs-utils/blob/v2.4.1/INSTALL.md
package_names:
  - binutils
  - cargo
  - cmake
  - gettext-envsubst
  - golang
  - make
  - openssl-devel
  - openssl-devel-engine
  - rpm-build
  # Fedora 42 and 43 do not offer gcc<=13, so we have to install it
  # via snapd.
  - snapd

# The version of amazon-efs-utils to install.
version: 2.4.1
