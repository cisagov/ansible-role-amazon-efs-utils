---
# The system packages to install.  See here for more details:
# https://github.com/aws/efs-utils/blob/v2.4.1/INSTALL.md
package_names:
  - binutils
  # cargo provides an ancient version, but cargo-web provides a much
  # more recent version.
  - cargo-web
  - cmake
  - gcc-12
  - g++-12
  - gettext-base
  - golang
  - libssl-dev
  - make
  - pkgconf

# The version of amazon-efs-utils to install.
version: 2.4.1
