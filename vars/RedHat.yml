---
# The system packages required to build RPMs from the efs-utils
# source.  See here for more details:
# https://github.com/aws/efs-utils/blob/v3.4.0/INSTALL.md
package_names:
  - binutils
  - cargo
  - cmake
  - gcc
  - gcc-c++
  - gettext-envsubst
  - golang
  - make
  - openssl-devel
  - openssl-devel-engine
  - rpm-build

# The version of amazon-efs-utils to install
version: 3.4.0
