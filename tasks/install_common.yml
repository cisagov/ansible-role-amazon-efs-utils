---
- name: Install amazon-efs-utils prerequisites
  ansible.builtin.package:
    name: "{{ package_names }}"

- name: Create the /tmp/efs-utils directory
  ansible.builtin.file:
    mode: 0755
    path: /tmp/efs-utils
    state: directory

- name: Download a tarball of the aws/efs-utils repository
  ansible.builtin.unarchive:
    src: https://github.com/aws/efs-utils/archive/refs/tags/v{{ version }}.tar.gz
    dest: /tmp/efs-utils
    remote_src: true
    extra_opts:
      - "--strip-components=1"
  # The contents of the tarball are modified in some cases by the
  # Makefile it contains, so we need to tag this task to skip
  # idempotence testing.
  tags:
    - molecule-idempotence-notest
